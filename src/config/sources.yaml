      Município gestor:
        tipo: purge
        rename: municipio
      0803 Autorizacao / Regulacao:
        cast: Int64
      Total:
        cast: Int64
    qualidade:
    ids:
      serviços:
        vigilancia em saude: 1.0
        consultas / atendimentos / acompanhamentos: 1.0
        diagnostico em vigilancia epidemiologica e ambiental: 1.0
        diagnostico em laboratorio clinico: 1.0
        coleta de material: 0.9
        tratamentos clinicos (outras especialidades): 0.9
        diagnostico por ultrasonografia: 0.9
        diagnostico por radiologia: 0.9
        fisioterapia: 0.8
        tratamentos odontologicos: 0.8
        diagnostico por teste rapido: 0.8
        terapias especializadas: 0.8
        diagnostico por tomografia: 0.8
        diagnostico por ressonancia magnetica: 0.8
        pequenas cirurgias e cirurgias de pele, tecido subcutaneo e mucosa: 0.7
        diagnostico por endoscopia: 0.7
        metodos diagnosticos em especialidades: 0.7
        diagnostico por anatomia patologica e citopatologia: 0.7
        bucomaxilofacial: 0.6
        diagnostico por radiologia intervencionista: 0.6
        anestesiologia: 0.6
        hemoterapia: 0.6
        diagnostico e procedimentos especiais em hemoterapia: 0.5
        diagnostico por medicina nuclear in vivo: 0.5
        tratamento em oncologia: 0.5
        tratamento em nefrologia: 0.5
        componente especializado da assitencia farmaceutica: 0.4
        orteses, proteses e materiais especiais nao relacionados ao ato cirurgico: 0.3
        autorizacao / regulacao: 0.3
        acoes coletivas / individuais em saude: 1.0
        acoes relacionadas ao estabelecimento: 0.2
