# =============================================================================
# Pipeline - Configuração de Fontes de Dados
# =============================================================================
#
# Campos por fonte:
#   arquivo        : nome do arquivo em data/clean
#   merge          : true = incluido no merged.csv final (padrão: true)
#   colunas_uteis  : whitelist de colunas. [] = mantém todas pro merged.csv
#   notas          : notas livres
#
# Bloco transformacoes (por coluna):
#   tipo:
#     mapa_ibge → mapeia via DF de referência (codigos_ibge_sp)
#     purge     → remove dígitos, strip, uppercase
#   convert_to_column:    → converte coluna categórica em múltiplas colunas (one-hot)
#     index               → coluna chave para o pivot (padrão: municipio)
#     values              → lista de colunas de valor para o pivot (obrigatório)
#     prefixo             → prefixo para as novas colunas criadas (opcional)
#   cast        → Int64 | float64 | str | datetime
#   rename      → renomeia a coluna para o nome especificado
#   mapa_ref    → nome da fonte de referência (padrão: codigos_ibge_sp)
#   col_chave   → coluna chave no DF ref (padrão: cod_ibge)
#   col_valor   → coluna de valor no DF ref (padrão: municipio)
#
# Bloco qualidade (por fonte):
#   cols_obrigatorias   : colunas que obrigatoriamente devem existir
#   cols_unicas         : colunas que precisam ser únicas
#   cols_nao_nulas      : colunas que independentemente não podem ser nulas
#   cols_numericas      : colunas que precisam ser algum tipo numérico
#
# Bloco IDS (por dimensionalidade):
#   dimensões:
#     infraestrutura      : colunas que devem ser relacionadas à infraestrutura de saúde do município
#     vulnerabilidade     : colunas que devem ser relacionadas à vulnerabilidade social do município
#     serviços            : colunas que devem ser relacionadas aos serviços ofertados de saúde do município
#     renda:
#       coluna_valor      : coluna relacionada à receita anual do município
#
# Bloco merge (nível raiz):
#   chave       : coluna comum usada para unir os DFs de dados
#   como        : tipo de join — left | right | inner | outer (padrão: left)
#   saida       : nome do arquivo final salvo em data/processed/
#
# Bloco ml_supervised (nível raiz):
#   enabled     : habilita a execução do módulo de ML supervisionado (padrão: true)
#   dataset:
#     arquivo           : nome do arquivo em data/processed a ser usado para ML supervisionado
#     global_features   : lista de colunas a serem usadas como features para todos os modelos (padrão: todas as colunas utilizadas no cálculo do IDS, exceto é claro o IDS em si)
#     global_target     : coluna a ser usada como alvo para o modelo (padrão: 'ids')
#   split:
#     global_test_size    : proporção do dataset a ser usado como teste (padrão: 0.2)
#     global_random_state : semente para divisão aleatória (padrão: 42)
#   preprocessing:
#     global_scale        : se true, aplica padronização (StandardScaler) a todas as features (padrão: true)
#     global_scaler       : tipo de scaler a ser usado (padrão: StandardScaler)
#   models:
#     - nome            : nome do modelo (ex: 'Random Forest Regressor (Depth=10)')
#       tipo            : tipo do modelo (Tipos disponíveis: LinearRegression, KNNRegressor, SVR, DecisionTreeRegressor, RandomForestRegressor, GradientBoostingRegressor, ExtraTreesRegressor, HistGradientBoostingRegressor, Lasso, Ridge)
#       features        : lista de colunas extras a serem usadas como features para este modelo (padrão: global_features + features)
#       drop_cols       : lista de colunas a serem excluídas para este modelo (padrão: [])
#       hyperparameters : dicionário de hiperparâmetros específicos para este modelo (padrão: {})
#       notas           : notas livres sobre o modelo
# =============================================================================

ml_supervised:
  enabled: true
  dataset:
    arquivo: main_dataframe.csv
    global_features: ['hospital_estadual', 'hospital_federal', 'hospital_municipal', 'hospital_particular', 'clinica_estadual', 'clinica_federal', 'clinica_municipal', 'clinica_particular', 'consultorio_total', 'pronto_atendimento_total', 'unidade_movel_total', 'baixissima vulnerabilidade_n_pessoas', 'muito baixa vulnerabilidade_n_pessoas', 'baixa vulnerabilidade_n_pessoas', 'media vulnerabilidade_n_pessoas', 'alta vulnerabilidade_n_pessoas', 'muito alta vulnerabilidade_n_pessoas', 'vigilancia em saude', 'consultas / atendimentos / acompanhamentos', 'diagnostico em vigilancia epidemiologica e ambiental', 'diagnostico em laboratorio clinico', 'coleta de material', 'tratamentos clinicos (outras especialidades)', 'diagnostico por ultrasonografia', 'diagnostico por radiologia', 'fisioterapia', 'tratamentos odontologicos', 'diagnostico por teste rapido', 'terapias especializadas', 'diagnostico por tomografia', 'diagnostico por ressonancia magnetica', 'pequenas cirurgias e cirurgias de pele, tecido subcutaneo e mucosa', 'diagnostico por endoscopia', 'metodos diagnosticos em especialidades', 'diagnostico por anatomia patologica e citopatologia', 'bucomaxilofacial', 'diagnostico por radiologia intervencionista', 'anestesiologia', 'hemoterapia', 'diagnostico e procedimentos especiais em hemoterapia', 'diagnostico por medicina nuclear in vivo', 'tratamento em oncologia', 'tratamento em nefrologia', 'componente especializado da assitencia farmaceutica', 'orteses, proteses e materiais especiais nao relacionados ao ato cirurgico', 'autorizacao / regulacao', 'acoes coletivas / individuais em saude', 'acoes relacionadas ao estabelecimento', 'tratamento de lesoes, envenenamentos e outros, decorrentes de causas externas', 'cirurgia do aparelho circulatorio', 'cirurgia do sistema nervoso central e periferico', 'parto e nascimento', 'medicamentos de ambito hospitalar e urgencia', 'cirurgia do aparelho digestivo, orgaos anexos e parede abdominal', 'cirurgia do sistema osteomuscular', 'cirurgia obstetrica', 'cirurgia toracica', 'cirurgia em oncologia', 'acoes relacionadas ao atendimento', 'cirurgia do aparelho geniturinario', 'cirurgia reparadora', 'cirurgia das vias aereas superiores, da face, da cabeca e do pescoco', 'cirurgia de mama', 'orteses, proteses e materiais especiais relacionados ao ato cirurgico', 'acompanhamento e intercorrencias no pre e pos-transplante', 'cirurgia do aparelho da visao', 'cirurgia de glandulas endocrinas', 'cirurgia em nefrologia', 'outras cirurgias', 'coleta e exames para fins de doacao de orgaos, tecidos e celulas e de transplante', 'acoes relacionadas a doacao de orgaos e tecidos para transplante', 'processamento de tecidos para transplante', 'transplante de orgaos, tecidos e celulas', 'avaliacao de morte encefalica', 'populacao', 'receita_anual']
    global_target: 'ids'

  split:
    global_test_size: 0.2
    global_random_state: 42
  
  preprocessing:
    global_scale: true
    global_scaler: StandardScaler

  models:
    - nome: 'Random Forest Regressor (Depth=10)'
      tipo: RandomForestRegressor
      features: []
      drop_cols: []
      hyperparameters:
        n_estimators: 500
        max_depth: 10
        min_samples_leaf: 2
        max_features: 'sqrt'
        n_jobs: -1
      notas: 'Modelo de Random Forest exemplo com 500 árvores e profundidade máxima de 10, para fins de demonstração'
    - nome: 'Gradient Boosting Regressor (Depth=2)'
      tipo: GradientBoostingRegressor
      features: []
      drop_cols: []
      hyperparameters:
        n_estimators: 200
        learning_rate: 0.05
        max_depth: 2
        min_samples_leaf: 5
        subsample: 0.8
      notas: 'Modelo de Gradient Boosting exemplo com 200 árvores e profundidade máxima de 2, para fins de demonstração'
    - nome: 'Extra Trees Regressor (Est=500)'
      tipo: ExtraTreesRegressor
      features: []
      drop_cols: []
      hyperparameters:
        n_estimators: 500
        max_depth:
        min_samples_leaf: 2
        n_jobs: -1
      notas: 'Modelo de Extra Trees exemplo com 500 árvores e profundidade None, para fins de demonstração'
    - nome: 'Hist Gradient Boosting Regressor (Iter=300)'
      tipo: HistGradientBoostingRegressor
      features: []
      drop_cols: []
      hyperparameters:
        max_iter: 300
        learning_rate: 0.05
        max_leaf_nodes: 15
        min_samples_leaf: 10
        l2_regularization: 0.1
      notas: 'Modelo de Hist Gradient Boosting exemplo com 300 iterações, para fins de demonstração'

merge:
  chave: municipio
  como: left
  saida: main_dataframe.csv

fontes:
  - nome: municipios
    arquivo: municipios.csv
    merge: true
    colunas_uteis: ['latitude', 'longitude']
    notas: 'Base de dados de todas as cidades do estado de SP, com seus respectivos
      códigos IBGE e coordenadas geográficas, extraída do IBGE'
    transformacoes:
      codigo_ibge:
        tipo: mapa_ibge
        rename: municipio
    qualidade:
    ids:
  - nome: estabelecimentos_saude
    arquivo: estabelecimentos_saude.csv
    merge: true
    colunas_uteis: ['hospital_estadual', 'hospital_federal', 'hospital_municipal',
      'hospital_particular', 'clinica_estadual', 'clinica_federal', 'clinica_municipal',
      'clinica_particular', 'consultorio_total', 'pronto_atendimento_total', 'unidade_movel_total']
    notas: 'Dados dos tipos e quantidade de estabelecimentos de saúde por município
      de SP, 2022, extraídos do CNES'
    transformacoes:
      municipio:
        tipo: purge
      tipo:
        convert_to_column: true
        index: municipio
        values: ['estadual', 'federal', 'municipal', 'particular', 'total']
    qualidade:
      cols_obrigatorias: ['municipio']
      cols_unicas: ['municipio']
      cols_nao_nulas: ['municipio']
    ids:
      infraestrutura:
        hospital_estadual: 0.9
        hospital_federal: 0.9
        hospital_municipal: 1.1
        hospital_particular: 0.5
        clinica_estadual: 0.45
        clinica_federal: 0.45
        clinica_municipal: 0.55
        clinica_particular: 0.25
        consultorio_total: 0.15
        pronto_atendimento_total: 0.65
        unidade_movel_total: 0.3
  - nome: healthcare_final_latlon
