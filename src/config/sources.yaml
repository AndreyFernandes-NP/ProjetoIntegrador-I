# =============================================================================
# Pipeline - Configuração de Fontes de Dados
# =============================================================================
#
# Campos por fonte:
#   arquivo        : nome do arquivo em data/clean
#   merge          : true = incluido no merged.csv final (padrão: true)
#   colunas_uteis  : whitelist de colunas. [] = mantém todas pro merged.csv
#   notas          : notas livres
#
# Bloco transformacoes (por coluna):
#   tipo:
#     mapa_ibge → mapeia via DF de referência (codigos_ibge_sp)
#     purge     → remove dígitos, strip, uppercase
#   convert_to_column:    → converte coluna categórica em múltiplas colunas (one-hot)
#     index               → coluna chave para o pivot (padrão: municipio)
#     values              → lista de colunas de valor para o pivot (obrigatório)
#     prefixo             → prefixo para as novas colunas criadas (opcional)
#   cast        → Int64 | float64 | str | datetime
#   rename      → renomeia a coluna para o nome especificado
#   mapa_ref    → nome da fonte de referência (padrão: codigos_ibge_sp)
#   col_chave   → coluna chave no DF ref (padrão: cod_ibge)
#   col_valor   → coluna de valor no DF ref (padrão: municipio)
#
# Bloco qualidade (por fonte):
#   cols_obrigatorias   : colunas que obrigatoriamente devem existir
#   cols_unicas         : colunas que precisam ser únicas
#   cols_nao_nulas      : colunas que independentemente não podem ser nulas
#   cols_numericas      : colunas que precisam ser algum tipo numérico
#
# Bloco IDS (por dimensionalidade):
#   dimensões:
#     infraestrutura      : colunas que devem ser relacionadas à infraestrutura de saúde do município
#     vulnerabilidade     : colunas que devem ser relacionadas à vulnerabilidade social do município
#     serviços            : colunas que devem ser relacionadas aos serviços ofertados de saúde do município
#     renda:
#       coluna_valor      : coluna relacionada à receita anual do município
#
# Bloco merge (nível raiz):
#   chave       : coluna comum usada para unir os DFs de dados
#   como        : tipo de join — left | right | inner | outer (padrão: left)
#   saida       : nome do arquivo final salvo em data/processed/
#
#
# Bloco validation (nível raiz):
#   enabled       : habilita ou não a geração de um banco de dados sintético e a predição com os modelos treinados (padrão: true)
#   rows          : quantidade de linhas que o dataset gerado vai ter (necessário ter nomes/sobrenomes o suficiente) (padrão: 100)
#   output        : nome do arquivo .csv que irá ser exportado na pasta processed (padrão: validation_samples)
#
#   columns:
#     ids           : nome da coluna que representa o target do df (padrão: ids)
#     municipality  : nome da coluna que iremos trocar os nomes das chaves com nossos próprios (padrão: municipio)
#
#   generation:
#     noise_factor              : int, quantidade em quantos % será aplicado uma variância de maior ou menor no dado da linha selecionada (padrão: 0.1 (10% pra +-))
#     preserve_zero_probability : true/false, chance em % de preservar ou não os valores zero, caso não preserve, irá gerar um valor aleatório com base na própria coluna do dataset (padrão: 0.9)
#     clip_to_original_range    : true/false, se o valor deve ou não ser clipado para a escala original, ex: ao ser -0.1, se torna 0.0, ao ser 1.1, se torna 1.0 (padrão: true)
#     sample_with_replacement   : true/false, quando o np.rng.choice() escolhe um valor, se esse campo for verdadeiro, ele pode escolher o mesmo valor mais de 1x, caso contrário, só poderá escolher ele uma única vez. Decida quando usar, os dois dão resultados um tanto que intrigantes (padrão: true)
#     null_strategy             : 'sample_column'/'zero', trata da forma que abordar colunas com valores nulos, cada um deles já é quase auto-explicativo.
#
#   sampling:
#     mode  : 'balanced'/'random', a forma com que os dados vão ser gerados, por favor não ser maluco de usar 'random', mas esse campo é bem exótico pros treinamentos. (padrão: balanced)
#     ids_distribution: (só é usado se mode = balanced)
#       low     : float(0,1), qual é a proporção de campos considerados low devem ter no dataset gerado, todos devem somar no final 100% ou 1.0 (padrão: 0.3)
#       medium  : float(0,1), qual é a proporção de campos considerados medium devem ter no dataset gerado, todos devem somar no final 100% ou 1.0 (padrão: 0.3)
#       high    : float(0,1), qual é a proporção de campos considerados high devem ter no dataset gerado, todos devem somar no final 100% ou 1.0 (padrão: 0.4)
#
#   names:
#     base_names_path       : nome do arquivo .txt que será usado para dar load nos primeiros nomes dos municípios (padrão: muni_nomes.txt)
#     surnames_path         : nome do arquivo .txt que será usado para dar load nos sobrenomes dos municípios (padrão: muni_sobrenomes.txt)
#     connector_probability : float(0,1), probabilidade dos nomes terem conectores como da, dos e etc antes do sobrenome (padrão: 0.3)
#     connectors            : lista dos conectores que serão usados/sorteados caso connector_probability dispare (padrão: - de, - da, - dos, sla é o básico)
#
# =============================================================================

validation:
  enabled: true
  rows: 100
  output: validation_samples.csv

  columns:
    ids: ids
    municipality: municipio
  
  generation:
    noise_factor: 0.15
    preserve_zero_probability: 0.95
    clip_to_original_range: true
    sample_with_replacement: false
    null_strategy: sample_column
  
  sampling:
    mode: balanced

    ids_distribution:
      low: 0.3
      medium: 0.3
      high: 0.4
  
  names:
    base_names_path: muni_nomes.txt
    surnames_path: muni_sobrenomes.txt
    connector_probability: 0.2
    connectors:
      - DE
      - DA
      - DO
      - DAS
      - DOS

merge:
  chave: municipio
  como: left
  saida: main_dataframe.csv

fontes:
  - nome: municipios
    arquivo: municipios.csv
    merge: true
    colunas_uteis: ['latitude', 'longitude']
    notas: 'Base de dados de todas as cidades do estado de SP, com seus respectivos
      códigos IBGE e coordenadas geográficas, extraída do IBGE'
    transformacoes:
      codigo_ibge:
        tipo: mapa_ibge
        rename: municipio
    qualidade:
    ids:
  - nome: estabelecimentos_saude
    arquivo: estabelecimentos_saude.csv
    merge: true
    colunas_uteis: ['hospital_estadual', 'hospital_federal', 'hospital_municipal',
      'hospital_particular', 'clinica_estadual', 'clinica_federal', 'clinica_municipal',
      'clinica_particular', 'consultorio_total', 'pronto_atendimento_total', 'unidade_movel_total']
    notas: 'Dados dos tipos e quantidade de estabelecimentos de saúde por município
      de SP, 2022, extraídos do CNES'
    transformacoes:
      municipio:
        tipo: purge
      tipo:
        convert_to_column: true
        index: municipio
        values: ['estadual', 'federal', 'municipal', 'particular', 'total']
    qualidade:
      cols_obrigatorias: ['municipio']
      cols_unicas: ['municipio']
      cols_nao_nulas: ['municipio']
    ids:
      infraestrutura:
        hospital_estadual: 0.9
        hospital_federal: 0.9
        hospital_municipal: 1.1
        hospital_particular: 0.5
        clinica_estadual: 0.45
        clinica_federal: 0.45
        clinica_municipal: 0.55
        clinica_particular: 0.25
        consultorio_total: 0.15
        pronto_atendimento_total: 0.65
        unidade_movel_total: 0.3
  - nome: healthcare_final_latlon
    arquivo: healthcare_final_latlon.csv
    merge: false
    colunas_uteis: []
    notas: 'Dados de estabelecimentos de saúde geolocalizados extraídos através do
      QGIS, utilizando o plugin MMQGIS para cruzar os dados de estabelecimentos de
      saúde do CNES com as coordenadas geográficas dos municípios de SP'
    transformacoes:
      latitude:
        cast: float64
      longitude:
        cast: float64
    qualidade:
    ids:
  - nome: inst_hospitalares_sp
    arquivo: inst_hospitalares_sp.csv
    merge: false
    colunas_uteis: ['Instituições Hospitalares']
    notas: 'Dados da quantidade de instituições hospitalares por município de SP,
      2022'
    transformacoes:
      municipio:
        tipo: purge
      quantidade:
        cast: Int64
        rename: Instituições Hospitalares
    qualidade:
    ids:
  - nome: ipvs_esp
    arquivo: ipvs_esp.csv
    merge: true
    colunas_uteis: ['baixissima vulnerabilidade_n_pessoas', 'muito baixa vulnerabilidade_n_pessoas',
      'baixa vulnerabilidade_n_pessoas', 'media vulnerabilidade_n_pessoas',
      'alta vulnerabilidade_n_pessoas', 'muito alta vulnerabilidade_n_pessoas']
    notas: 'Dados do Índice Paulista de Vulnerabilidade Social (IPVS) por setor censitário,
      2022, fornecido pela Fundação Seade e IBGE'
    transformacoes:
      cod_ibge:
        tipo: mapa_ibge
        rename: municipio
      grupo_ipvs:
        convert_to_column: true
        index: municipio
        values: ['n_pessoas', 'n_domicilios', 'n_setores']
    qualidade:
      cols_obrigatorias: ['municipio']
      cols_unicas: ['municipio']
      cols_nao_nulas: ['municipio']
      cols_numericas: ['n_pessoas', 'n_domicilios', 'n_setores']
    ids:
      vulnerabilidade:
        baixissima vulnerabilidade_n_pessoas: 0.0
        muito baixa vulnerabilidade_n_pessoas: 0.15
        baixa vulnerabilidade_n_pessoas: 0.3
        media vulnerabilidade_n_pessoas: 0.5
        alta vulnerabilidade_n_pessoas: 0.75
        muito alta vulnerabilidade_n_pessoas: 1.0
  - nome: sia_cnv_qgsp
    arquivo: sia_cnv_qgsp.csv
    merge: true
    colunas_uteis: ['vigilancia em saude', 'consultas / atendimentos / acompanhamentos', 'diagnostico em vigilancia epidemiologica e ambiental', 'diagnostico em laboratorio clinico', 'coleta de material', 'tratamentos clinicos (outras especialidades)', 'diagnostico por ultrasonografia', 'diagnostico por radiologia', 'fisioterapia', 'tratamentos odontologicos', 'diagnostico por teste rapido', 'terapias especializadas', 'diagnostico por tomografia', 'diagnostico por ressonancia magnetica', 'pequenas cirurgias e cirurgias de pele, tecido subcutaneo e mucosa', 'diagnostico por endoscopia', 'metodos diagnosticos em especialidades', 'diagnostico por anatomia patologica e citopatologia', 'bucomaxilofacial', 'diagnostico por radiologia intervencionista', 'anestesiologia', 'hemoterapia', 'diagnostico e procedimentos especiais em hemoterapia', 'diagnostico por medicina nuclear in vivo', 'tratamento em oncologia', 'tratamento em nefrologia', 'componente especializado da assitencia farmaceutica', 'orteses, proteses e materiais especiais nao relacionados ao ato cirurgico', 'autorizacao / regulacao', 'acoes coletivas / individuais em saude', 'acoes relacionadas ao estabelecimento']
    notas: 'Dados da Rede de Atenção à Saúde (SIA) por município de SP, 2022'
