# =============================================================================
# Pipeline - Configuração de Fontes de Dados
# =============================================================================
#
# Campos por fonte:
#   arquivo        : nome do arquivo em data/clean
#   merge          : true = incluido no merged.csv final (padrão: true)
#   colunas_uteis  : whitelist de colunas. [] = mantém todas pro merged.csv
#   notas          : notas livres
#
# Bloco transformacoes (por coluna):
#   tipo:
#     mapa_ibge → mapeia via DF de referência (codigos_ibge_sp)
#     purge     → remove dígitos, strip, uppercase
#   convert_to_column:    → converte coluna categórica em múltiplas colunas (one-hot)
#     index               → coluna chave para o pivot (padrão: municipio)
#     values              → lista de colunas de valor para o pivot (obrigatório)
#     prefixo             → prefixo para as novas colunas criadas (opcional)
#   cast        → Int64 | float64 | str | datetime
#   rename      → renomeia a coluna para o nome especificado
#   mapa_ref    → nome da fonte de referência (padrão: codigos_ibge_sp)
#   col_chave   → coluna chave no DF ref (padrão: cod_ibge)
#   col_valor   → coluna de valor no DF ref (padrão: municipio)
#
# Bloco qualidade (por fonte):
#   cols_obrigatorias   : colunas que obrigatoriamente devem existir
#   cols_unicas         : colunas que precisam ser únicas
#   cols_nao_nulas      : colunas que independentemente não podem ser nulas
#   cols_numericas      : colunas que precisam ser algum tipo numérico
#
# Bloco IDS (por dimensionalidade):
#   dimensões:
#     infraestrutura      : colunas que devem ser relacionadas à infraestrutura de saúde do município
#     vulnerabilidade     : colunas que devem ser relacionadas à vulnerabilidade social do município
#     serviços            : colunas que devem ser relacionadas aos serviços ofertados de saúde do município
#     renda:
#       coluna_valor      : coluna relacionada à receita anual do município
#
# Bloco merge (nível raiz):
#   chave       : coluna comum usada para unir os DFs de dados
#   como        : tipo de join — left | right | inner | outer (padrão: left)
#   saida       : nome do arquivo final salvo em data/processed/
# =============================================================================

ml_supervised:
  enabled: true
  dataset:
    arquivo: main_dataframe.csv
    global_features: ['hospital_estadual', 'hospital_federal', 'hospital_municipal', 'hospital_particular', 'clinica_estadual', 'clinica_federal', 'clinica_municipal', 'clinica_particular', 'consultorio_total', 'pronto_atendimento_total', 'unidade_movel_total', 'baixissima vulnerabilidade_n_pessoas', 'muito baixa vulnerabilidade_n_pessoas', 'baixa vulnerabilidade_n_pessoas', 'media vulnerabilidade_n_pessoas', 'alta vulnerabilidade_n_pessoas', 'muito alta vulnerabilidade_n_pessoas', 'diagnostico em laboratorio clinico', 'diagnostico por radiologia', 'diagnostico por teste rapido', 'tratamentos clinicos (outras especialidades)', 'parto e nascimento', 'cirurgia obstetrica', 'pequenas cirurgias e cirurgias de pele, tecido subcutaneo e mucosa', 'acoes relacionadas ao atendimento', 'populacao', 'receita_anual', 'ids']
    global_target: 'ids'

  split:
    global_test_size: 0.2
    global_random_state: 42
  
  preprocessing:
    global_scale: true
    global_scaler: StandardScaler

  models:
    - nome: 'KNN Regressor (N=5)'
      tipo: KNNRegressor
      features: []
      drop_cols: []
      hyperparameters:
        n_neighbors: 5
      notas: 'Modelo KNN exemplo com N=5, sem features específicas ou hiperparâmetros definidos, para fins de demonstração'
    - nome: 'Random Forest Regressor (Depth=10)'
      tipo: RandomForestRegressor
      features: []
      drop_cols: []
      hyperparameters:
        n_estimators: 100
        max_depth: 10
      notas: 'Modelo de Random Forest exemplo com 100 árvores e profundidade máxima de 10, para fins de demonstração'
    - nome: 'SVR (RBF, C=1.0)'
      tipo: SVR
      features: []
      drop_cols: []
      hyperparameters:
        kernel: rbf
        C: 1.0
      notas: 'Modelo de SVM exemplo com kernel RBF e parâmetro C igual a 1.0, para fins de demonstração'

merge:
  chave: municipio
  como: left
  saida: main_dataframe.csv

fontes:
  - nome: municipios
    arquivo: municipios.csv
    merge: true
    colunas_uteis: ['latitude', 'longitude']
    notas: 'Base de dados de todas as cidades do estado de SP, com seus respectivos
      códigos IBGE e coordenadas geográficas, extraída do IBGE'
    transformacoes:
      codigo_ibge:
        tipo: mapa_ibge
        rename: municipio
    qualidade:
    ids:
  - nome: estabelecimentos_saude
    arquivo: estabelecimentos_saude.csv
    merge: true
    colunas_uteis: ['hospital_estadual', 'hospital_federal', 'hospital_municipal',
      'hospital_particular', 'clinica_estadual', 'clinica_federal', 'clinica_municipal',
      'clinica_particular', 'consultorio_total', 'pronto_atendimento_total', 'unidade_movel_total']
    notas: 'Dados dos tipos e quantidade de estabelecimentos de saúde por município
      de SP, 2022, extraídos do CNES'
    transformacoes:
      municipio:
        tipo: purge
      tipo:
        convert_to_column: true
        index: municipio
        values: ['estadual', 'federal', 'municipal', 'particular', 'total']
    qualidade:
      cols_obrigatorias: ['municipio']
      cols_unicas: ['municipio']
      cols_nao_nulas: ['municipio']
    ids:
      infraestrutura:
        hospital_estadual: 0.9
        hospital_federal: 0.9
        hospital_municipal: 1.1
        hospital_particular: 0.5
        clinica_estadual: 0.45
        clinica_federal: 0.45
        clinica_municipal: 0.55
        clinica_particular: 0.25
        consultorio_total: 0.15
        pronto_atendimento_total: 0.65
        unidade_movel_total: 0.3
  - nome: healthcare_final_latlon
    arquivo: healthcare_final_latlon.csv
    merge: false
    colunas_uteis: []
    notas: 'Dados de estabelecimentos de saúde geolocalizados extraídos através do
      QGIS, utilizando o plugin MMQGIS para cruzar os dados de estabelecimentos de
      saúde do CNES com as coordenadas geográficas dos municípios de SP'
    transformacoes:
      latitude:
        cast: float64
      longitude:
        cast: float64
    qualidade:
    ids:
  - nome: inst_hospitalares_sp
    arquivo: inst_hospitalares_sp.csv
    merge: false
    colunas_uteis: ['Instituições Hospitalares']
    notas: 'Dados da quantidade de instituições hospitalares por município de SP,
      2022'
    transformacoes:
      municipio:
        tipo: purge
      quantidade:
        cast: Int64
        rename: Instituições Hospitalares
    qualidade:
    ids:
  - nome: ipvs_esp
    arquivo: ipvs_esp.csv
    merge: true
    colunas_uteis: ['baixissima vulnerabilidade_n_pessoas', 'muito baixa vulnerabilidade_n_pessoas',
      'baixa vulnerabilidade_n_pessoas', 'media vulnerabilidade_n_pessoas',
      'alta vulnerabilidade_n_pessoas', 'muito alta vulnerabilidade_n_pessoas']
    notas: 'Dados do Índice Paulista de Vulnerabilidade Social (IPVS) por setor censitário,
      2022, fornecido pela Fundação Seade e IBGE'
    transformacoes:
      cod_ibge:
        tipo: mapa_ibge
        rename: municipio
      grupo_ipvs:
        convert_to_column: true
        index: municipio
        values: ['n_pessoas', 'n_domicilios', 'n_setores']
    qualidade:
      cols_obrigatorias: ['municipio']
      cols_unicas: ['municipio']
      cols_nao_nulas: ['municipio']
      cols_numericas: ['n_pessoas', 'n_domicilios', 'n_setores']
    ids:
      vulnerabilidade:
        baixissima vulnerabilidade_n_pessoas: 0.0
        muito baixa vulnerabilidade_n_pessoas: 0.15
        baixa vulnerabilidade_n_pessoas: 0.3
        media vulnerabilidade_n_pessoas: 0.5
        alta vulnerabilidade_n_pessoas: 0.75
        muito alta vulnerabilidade_n_pessoas: 1.0
  - nome: sia_cnv_qgsp
    arquivo: sia_cnv_qgsp.csv
    merge: true
    colunas_uteis: ['vigilancia em saude', 'consultas / atendimentos / acompanhamentos']
    notas: 'Dados da Rede de Atenção à Saúde (SIA) por município de SP, 2022'
    transformacoes:
      Município gestor:
        tipo: purge
        rename: municipio
      0803 Autorizacao / Regulacao:
        cast: Int64
      Total:
        cast: Int64
    qualidade:
    ids:
      serviços:
        vigilancia em saude: 0.6
        consultas / atendimentos / acompanhamentos: 1.0
  - nome: sih_cnv_spgsp
    arquivo: sih_cnv_spgsp.csv
    merge: true
    colunas_uteis: ['diagnostico em laboratorio clinico', 'diagnostico por radiologia',
      'diagnostico por teste rapido', 'tratamentos clinicos (outras especialidades)',
      'parto e nascimento', 'cirurgia obstetrica', 'pequenas cirurgias e cirurgias
          de pele, tecido subcutaneo e mucosa', 'acoes relacionadas ao atendimento']
    notas: 'Dados do Sistema de Informações Hospitalares (SIH) por município de SP,
      2022'
    transformacoes:
      Município:
        tipo: purge
      Total:
        cast: Int64
    qualidade:
    ids:
      serviços:
        diagnostico em laboratorio clinico: 0.55
        diagnostico por radiologia: 0.55
        diagnostico por teste rapido: 0.25
        tratamentos clinicos (outras especialidades): 0.4
        parto e nascimento: 0.5
        cirurgia obstetrica: 0.4
        pequenas cirurgias e cirurgias de pele, tecido subcutaneo e mucosa: 0.25
        acoes relacionadas ao atendimento: 0.2
  - nome: tabela30_SP_internacao
    arquivo: tabela30_SP_internacao.csv
    merge: false
    colunas_uteis: []
    notas: 'Tabela de Internações por tipo de serviço ou equipamento do município
      de SP, 2022, extraída do Tabnet do DATASUS'
    transformacoes:
      Internação x tipo de Serviços ou Equipamentos:
        tipo: purge
      Total:
        cast: Int64
      Público:
        cast: Int64
      Privado:
        cast: Int64
      Privado/SUS:
        cast: Int64
    qualidade:
    ids:
  - nome: finbra_2022SP
    arquivo: finbra_2022SP.csv
    merge: true
    colunas_uteis: ['populacao', 'receita_anual']
    notas: 'Dados da Finbra 2022 por município de SP, extraídos do site da Secretaria da Fazenda do Estado de São Paulo'
    transformacoes:
      cod_ibge:
        tipo: mapa_ibge
        rename: municipio
      valor:
        cast: float64
        rename: receita_anual
    qualidade:
      cols_numericas: ['receita_anual']
    ids:
      renda:
        coluna_valor: receita_anual

  # ── Template para novas fontes ───────────────────────────────────────────
